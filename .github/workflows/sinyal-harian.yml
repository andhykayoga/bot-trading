# Sinyal harian bertanda skor (kripto, IPO, ganti pengendali) ke Telegram tiap 07.15 WIB, dengan jurnal otomatis
# di jurnal/sinyal.csv. Jawaban tombol Telegram (ambil/lewati) dicatat lagi tiap 19.15 WIB.
# Butuh dua secret di Settings → Secrets and variables → Actions: TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID.
# Jadwal otomatis hanya berjalan dari branch utama (main). Push ke branch lain hanya mencoba skripnya tanpa mengirim.
name: Sinyal harian ke Telegram

on:
  schedule:
    - cron: "15 0 * * *"          # 00.15 UTC = 07.15 WIB: sinyal
    - cron: "15 12 * * *"         # 12.15 UTC = 19.15 WIB: hanya mencatat jawaban tombol
  workflow_dispatch:
    inputs:
      selalu:
        description: "Kirim pesan walaupun tidak ada aksi (untuk mencoba)"
        type: boolean
        default: true
  push:
    paths:
      - "scripts/sinyal_harian.py"
      - "bot/telegram.py"
      - "bot/jurnal.py"
      - ".github/workflows/sinyal-harian.yml"

permissions:
  contents: write                 # untuk menyimpan jurnal/sinyal.csv ke repo

concurrency:
  group: sinyal-harian
  cancel-in-progress: false

jobs:
  sinyal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2.0" "pandas>=2.2" "pyarrow>=15"
      - name: Hitung sinyal dan kirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Permintaan pengguna: jadwal otomatis mulai Rabu 4 November 2026 (uji manual tetap bisa kapan saja).
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$(TZ=Asia/Jakarta date +%F)" < "2026-11-04" ]]; then
            echo "Jadwal baru mulai 2026-11-04; hari ini dilewati."
          elif [ "${{ github.event_name }}" = "push" ]; then
            python scripts/sinyal_harian.py
          elif [ "${{ github.event.schedule }}" = "15 12 * * *" ]; then
            python scripts/sinyal_harian.py --catat-jawaban
          elif [ "${{ inputs.selalu }}" = "true" ]; then
            python scripts/sinyal_harian.py --telegram --jurnal --selalu
          else
            python scripts/sinyal_harian.py --telegram --jurnal
          fi
      - name: Simpan jurnal ke repo
        if: github.event_name != 'push'
        run: |
          git config user.name "bot-sinyal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jurnal/
          if ! git diff --cached --quiet; then
            git commit -m "Jurnal sinyal $(date -u +%F)"
            git pull --rebase -q
            git push
          fi
